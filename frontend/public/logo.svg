<?xml version="1.0" encoding="utf-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024" role="img" aria-label="Mail icon with red to dark gradient background">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#C71E24"/>
      <stop offset="100%" stop-color="#121212"/>
    </linearGradient>
  </defs>

  <!-- Rounded square background with gradient -->
  <rect x="16" y="16" width="992" height="992" rx="200" ry="200" fill="url(#g)"/>

  <!-- Envelope outline -->
  <rect x="192" y="336" width="640" height="352" rx="48" ry="48"
        fill="none" stroke="#ffffff" stroke-width="64"
        stroke-linejoin="round" stroke-linecap="round"/>

  <!-- Envelope flap (center V) aligned with rectangle edges -->
  <path d="M 220 350 L 512 512 L 800 350"
        fill="none" stroke="#ffffff" stroke-width="50"
        stroke-linejoin="round" stroke-linecap="round"/>
</svg>

